version: '3.8'

services:
  # 1. AI Agent Studio Control Plane Backend
  agent-studio-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-studio-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://agent_admin:SecretPass888@postgres-db:5432/agent_studio
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 2. PostgreSQL 16 Enterprise Database
  postgres-db:
    image: postgres:16-alpine
    container_name: agent-studio-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agent_admin
      POSTGRES_PASSWORD: SecretPass888
      POSTGRES_DB: agent_studio
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/server/schema.sql:/docker-entrypoint-initdb.d/init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_admin -d agent_studio"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Optional: High-Performance Go 1.22+ Metal3 Operator Backend (Port 8080)
  agent-studio-go-backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: agent-studio-go-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://agent_admin:SecretPass888@postgres-db:5432/agent_studio
    profiles: ["go", "all"]

  # 4. Optional: Python 3.12+ FastAPI AI Ecosystem Backend (Port 8000)
  agent-studio-python-backend:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: agent-studio-python-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgres://agent_admin:SecretPass888@postgres-db:5432/agent_studio
    profiles: ["python", "all"]

volumes:
  pgdata:
    driver: local
