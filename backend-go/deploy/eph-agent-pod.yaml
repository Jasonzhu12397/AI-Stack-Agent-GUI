apiVersion: v1
kind: Pod
metadata:
  name: metal3-eph-agent-daemon-7b89f4
  namespace: metal3-system
  labels:
    app.kubernetes.io/name: metal3-eph-agent
    app.kubernetes.io/component: bootstrap-orchestrator
    app.kubernetes.io/runtime: golang-1.22
    app.kubernetes.io/agent-role: eph-node-bootstrap
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  restartPolicy: Always
  nodeSelector:
    node-role.kubernetes.io/bootstrap: "true"
  tolerations:
    - operator: Exists
      effect: NoSchedule
  containers:
    - name: eph-agent
      image: registry.enterprise.internal/metal3/eph-agent:v2.4.0-go
      imagePullPolicy: IfNotPresent
      command: ["/bin/eph-agent"]
      ports:
        - name: probe
          containerPort: 8081
          protocol: TCP
        - name: metrics
          containerPort: 9091
          protocol: TCP
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: COORDINATOR_URL
          value: "http://10.240.10.1:9090"
        - name: IRONIC_ENDPOINT
          value: "http://10.240.10.1:6385/v1"
        - name: PROBE_PORT
          value: "8081"
        - name: GOMAXPROCS
          value: "4"
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8081
        initialDelaySeconds: 3
        periodSeconds: 5
        timeoutSeconds: 2
      readinessProbe:
        httpGet:
          path: /readyz
          port: 8081
        initialDelaySeconds: 2
        periodSeconds: 4
        timeoutSeconds: 2
      startupProbe:
        httpGet:
          path: /healthz
          port: 8081
        failureThreshold: 10
        periodSeconds: 2
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        privileged: true
        capabilities:
          add: ["NET_ADMIN", "SYS_ADMIN"]
      volumeMounts:
        - name: dnsmasq-leases
          mountPath: /var/lib/dnsmasq
        - name: tftp-boot
          mountPath: /tftpboot
        - name: redfish-certs
          mountPath: /etc/redfish/certs
          readOnly: true
  volumes:
    - name: dnsmasq-leases
      hostPath:
        path: /var/lib/dnsmasq
        type: DirectoryOrCreate
    - name: tftp-boot
      hostPath:
        path: /tftpboot
        type: DirectoryOrCreate
    - name: redfish-certs
      secret:
        secretName: bmc-redfish-tls-certs
