apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: capm3-target-agent-operator
  namespace: capi-system
  labels:
    app.kubernetes.io/name: capm3-target-agent
    app.kubernetes.io/component: target-lifecycle-manager
    app.kubernetes.io/runtime: golang-1.22
    app.kubernetes.io/agent-role: target-cluster-lifecycle
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: capm3-target-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capm3-target-agent
        app.kubernetes.io/runtime: golang-1.22
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: capm3-target-agent-sa
      priorityClassName: system-cluster-critical
      tolerations:
        - operator: Exists
      containers:
        - name: target-agent
          image: registry.enterprise.internal/metal3/target-agent:v2.4.0-go
          imagePullPolicy: IfNotPresent
          command: ["/bin/target-agent"]
          ports:
            - name: probe
              containerPort: 8082
              protocol: TCP
            - name: metrics
              containerPort: 9092
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: COORDINATOR_URL
              value: "http://10.240.10.1:9090"
            - name: PROBE_PORT
              value: "8082"
            - name: GOMAXPROCS
              value: "4"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 2
            periodSeconds: 4
            timeoutSeconds: 2
          startupProbe:
            httpGet:
              path: /healthz
              port: 8082
            failureThreshold: 10
            periodSeconds: 2
          resources:
            requests:
              cpu: 150m
              memory: 96Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "SYS_ADMIN", "IPC_LOCK"]
          volumeMounts:
            - name: cni-bin
              mountPath: /opt/cni/bin
            - name: cni-conf
              mountPath: /etc/cni/net.d
            - name: kubeconfig
              mountPath: /etc/kubernetes/admin.conf
              readOnly: true
            - name: sriov-devices
              mountPath: /sys/class/net
      volumes:
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
        - name: cni-conf
          hostPath:
            path: /etc/cni/net.d
        - name: kubeconfig
          hostPath:
            path: /etc/kubernetes/admin.conf
        - name: sriov-devices
          hostPath:
            path: /sys/class/net
